# MCP Guard — HTTP transport example (Guard-Light mode)
#
# The guard listens on HTTP instead of stdio, so AI clients
# (Claude Desktop, Claude Code, etc.) connect via URL.
#
# Claude Code MCP config (~/.claude/settings.json):
#   {
#     "mcpServers": {
#       "mcp-guard": {
#         "type": "url",
#         "url": "http://localhost:31415/mcp"
#       }
#     }
#   }

version: 1

listen:
  transport: http
  port: 31415
  host: 0.0.0.0

# Upstream MCP servers to proxy
servers:
  - name: filesystem
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/data/project"]
    # Optional: shrink verbose JSON results before they reach the AI client.
    # The first transform whose `tools` match applies; non-JSON text passes through.
    # responseTransforms:
    #   - tools: ["search_*"]
    #     compactJson: true                  # drop indentation
    #     omitKeys: ["metadata", "debug_*"]  # drop these keys at any depth

policy:
  defaultAction: deny
  # Denied tools are left out of tools/list (fewer context tokens for the client).
  # Set to false to advertise them anyway; calling one is still denied.
  hideDeniedTools: true

  rules:
    - tool: "read_*"
      allow: true
    - tool: "search_files"
      allow: true
    - tool: "list_*"
      allow: true
    - tool: "write_file"
      allow: false

audit:
  dbPath: /data/guard.db
  retentionHours: 24

logLevel: info
